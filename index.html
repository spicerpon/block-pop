<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "Block Pop",
  "url": "https://kogames.dev/block-pop/",
  "image": "https://kogames.dev/block-pop/assets/og.jpg",
  "description": "A free block blast puzzle played in the browser. Drag blocks onto the 8×8 board, fill rows and columns to blast them, chain combos and collect gems through Adventure levels.",
  "genre": ["Puzzle", "Casual", "Block"],
  "playMode": "SinglePlayer",
  "gamePlatform": "Web browser",
  "applicationCategory": "GameApplication",
  "operatingSystem": "Any",
  "inLanguage": ["en", "ko", "ja", "ru", "es", "fr"],
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Noto+Sans+KR:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="page">
  <div id="stage" aria-label="Block Pop">
    <canvas id="game"></canvas>

    <!-- ===== HUD (in-game top bar) ===== -->
    <div id="hud" hidden>
      <div class="topbar">
        <div class="tb-side tb-left">
          <button class="icon-btn c-slate" id="btn-home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.2V21h6.2v-6h5.6v6H21V10.2Z"/></svg></button>
        </div>
        <div class="tb-center">
          <div class="score-wrap" id="score-wrap">
            <div class="score" id="score">0</div>
            <div class="pill best"><svg viewBox="0 0 24 24" class="crown"><path d="M3 18 2 7l5 4 5-7 5 7 5-4-1 11z"/><rect x="3" y="19" width="18" height="2.5" rx="1"/></svg><span id="best">0</span></div>
          </div>
          <div class="obj-wrap" id="obj-wrap" hidden>
            <div class="lvl-label" id="lvl-label">LEVEL 1</div>
            <div class="obj-chips">
              <span class="obj-chip red" id="obj-red" hidden><i class="gem-dot r"></i><b id="obj-red-n">0</b></span>
              <span class="obj-chip blue" id="obj-blue" hidden><i class="gem-dot b"></i><b id="obj-blue-n">0</b></span>
            </div>
          </div>
        </div>
        <div class="tb-side tb-right">
          <button class="icon-btn c-amber" id="btn-rank" aria-label="Ranking"><svg viewBox="0 0 24 24"><path d="M4 13h4v7H4zM10 4h4v16h-4zM16 9h4v11h-4z"/></svg></button>
          <button class="icon-btn c-slate" id="btn-menu" aria-label="Menu"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="2.6" rx="1.3"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3"/><rect x="4" y="15.4" width="16" height="2.6" rx="1.3"/></svg></button>
        </div>
      </div>
    </div>

    <!-- ===== TITLE ===== -->
    <div id="title" class="screen">
      <div class="title-card">
        <canvas id="logo" width="10" height="10" aria-hidden="true"></canvas>
        <p id="t-tagline" class="tagline"></p>
        <button class="btn big c-green" id="btn-play"><span id="t-play">PLAY</span></button>
        <button class="btn big c-blue" id="btn-adventure"><span id="t-adventure">ADVENTURE</span><span class="btn-sub" id="t-adv-lvl"></span></button>
        <div class="title-links">
          <button class="link" id="btn-howto">How to play</button>
        <a class="link" href="guide/" id="lnk-guide">Guide</a>
          <button class="link" id="btn-title-rank">Ranking</button>
          <button class="link" id="btn-themes">Themes</button>
          <button class="link" id="btn-ach">Achievements</button>
          <button class="link" id="btn-lang"></button>
        </div>
        <div class="title-best" id="title-best"></div>
      </div>
      <a class="home-link" href="/" id="home-link">KOGAMES</a>
    </div>

    <!-- ===== POPUP ROOT ===== -->
    <div id="popups"></div>
    <div id="toast" hidden></div>
  </div>
  <noscript><p style="color:#fff;text-align:center;padding:2rem">Block Pop needs JavaScript to run.</p></noscript>
</div>
<script src="game.js"></script>
</body>
</html>
